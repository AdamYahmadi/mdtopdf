<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mdtopdf</title>
<style>
  :root {
    --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-editor: var(--font-ui);
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root {
    --ink: #1c1d1f; --ink-soft: #52545a; --muted: #8a8c93;
    --canvas: #d5d6da; --surface: #f6f7f8; --paper: #ffffff;
    --line: #d9dade; --line-soft: #e6e7ea; --accent: #2f57d6;
    --t-head:#08429c; --t-strong:#9a3d00; --t-em:#6a1fb0; --t-code:#06693f;
    --t-fence:#a01818; --t-link:#0a44c0; --t-url:#4b5563; --t-math:#b01259;
    --t-list:#08429c; --t-quote:#3f5c35; --t-punct:#4b5563;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; height: 52px; padding: 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--line); flex: none;
  }
  .wordmark { font-family: var(--font-mono); font-weight: 500; font-size: 15px; letter-spacing: -0.02em; color: var(--ink); }
  .spacer { flex: 1; }
  .toolbar { display: flex; align-items: center; gap: 12px; }
  .status { font-family: var(--font-mono); font-size: 12px; color: #2d8a4e; white-space: nowrap; transition: color .2s ease; }
  .status.busy { color: #c73a3a; }
  .status.error { color: #c73a3a; }
  .divider { width: 1px; height: 20px; background: var(--line); }

  .doc-name { display: flex; align-items: baseline; gap: 1px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
  .doc-name:focus-within { border-bottom-color: var(--accent); }
  .doc-name input { font-family: var(--font-mono); font-size: 13px; color: var(--ink); border: 0; background: transparent; outline: none; width: 100px; text-align: right; padding: 0; }
  .doc-name input:focus-visible { outline: none; }
  .doc-name .ext { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; transition: background .15s ease, color .15s ease; }
  .icon-btn:hover { background: rgba(127,127,127,.12); color: var(--ink); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  .btn { display: inline-flex; align-items: center; height: 30px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; letter-spacing: -0.005em; border: 1px solid var(--line); border-radius: 7px; padding: 0 12px; cursor: pointer; background: var(--surface); color: var(--ink); transition: background .15s ease, border-color .15s ease; }
  .btn:hover { background: #fff; border-color: #bbbcc0; }
  .btn:disabled { color: var(--muted); cursor: default; background: var(--surface); border-color: var(--line); }
  .btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 13px; height: 13px; margin-right: 5px; flex: none; }

  .guide-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; transition: opacity .2s ease; }
  .guide-overlay.show { display: flex; }
  .guide-overlay.fade { opacity: 0; pointer-events: none; }
  .guide {
    background: #fff; border-radius: 12px; padding: 28px 32px; max-width: 400px; width: 90%;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    font-family: var(--font-ui); color: var(--ink);
  }
  .guide h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
  .guide dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: baseline; }
  .guide dt { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; white-space: nowrap; text-align: right; }
  .guide dd { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .guide .dismiss { margin-top: 20px; text-align: center; }
  .guide .dismiss button { font-family: var(--font-ui); font-size: 13px; font-weight: 500; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 6px 16px; border-radius: 6px; transition: background .12s ease; }
  .guide .dismiss button:hover { background: rgba(47,87,214,.08); }

  main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane.source { border-right: 1px solid var(--line); }

  .pane-head { display: flex; align-items: center; height: 36px; padding: 0 16px; flex: none; border-bottom: 1px solid var(--line-soft); background: var(--surface); }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 3px; }
  .stepper button { width: 22px; height: 22px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink-soft); font-size: 14px; line-height: 1; cursor: pointer; transition: background .12s ease, color .12s ease; }
  .stepper button:hover { background: rgba(127,127,127,.12); color: var(--ink); }
  .stepper button:disabled { opacity: .4; cursor: default; }
  .stepper #sizeVal { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); min-width: 34px; text-align: center; }

  .editor { position: relative; flex: 1; min-height: 0; background: var(--surface); }
  .editor pre, .editor textarea { margin: 0; border: 0; padding: 20px 22px; font-family: var(--font-editor); font-size: 14px; line-height: 1.5; letter-spacing: 0; tab-size: 2; white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; }
  .editor pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); z-index: 0; scrollbar-gutter: stable; }
  .editor textarea { position: absolute; inset: 0; width: 100%; height: 100%; overflow: auto; resize: none; outline: none; scrollbar-gutter: stable; background: transparent; color: transparent; caret-color: var(--accent); z-index: 1; }
  .editor textarea::selection { background: rgba(127,140,200,.30); }

  .tok-head { color: var(--t-head); font-weight: 700; }
  .tok-strong { color: var(--t-strong); font-weight: 700; }
  .tok-em { color: var(--t-em); font-style: italic; }
  .tok-code { color: var(--t-code); }
  .tok-fence { color: var(--t-fence); }
  .tok-link { color: var(--t-link); text-decoration: underline; text-underline-offset: 2px; }
  .tok-url { color: var(--t-url); }
  .tok-math { color: var(--t-math); }
  .tok-quote { color: var(--t-quote); font-style: italic; }
  .tok-list { color: var(--t-list); font-weight: 600; }
  .tok-punct { color: var(--t-punct); }
  .tok-hr { color: var(--t-punct); }

  .drop { position: absolute; inset: 9px; z-index: 3; border: 1.5px dashed var(--accent); border-radius: 9px; background: rgba(47,87,214,.06); display: none; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 13px; color: var(--accent); pointer-events: none; }
  .editor.dragging .drop { display: flex; }

  .pane.preview { background: var(--canvas); }
  .proof { position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--canvas); padding: 28px 32px; min-width: 0; scrollbar-gutter: stable; }
  .proof .page { width: fit-content; margin: 0 auto 24px; overflow: hidden; border-radius: 1px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 28px rgba(0,0,0,.13); max-width: 100%; }
  .proof .page canvas { display: block; background: #fff; }
  .proof .empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; padding: 24px; pointer-events: none; }
  .proof .empty.show { display: flex; }

  @media (max-width: 820px) {
    body { overflow: auto; }
    main { grid-template-columns: 1fr; }
    .pane.source { border-right: 0; border-bottom: 1px solid var(--line); }
    .pane { min-height: 64vh; }
    .doc-name, .divider { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="wordmark">mdtopdf</div>
    <a class="icon-btn" href="https://github.com/AdamYahmadi/mdtopdf" target="_blank" rel="noopener" title="GitHub" aria-label="View on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.64 7.64 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <div class="spacer"></div>
    <div class="toolbar">
      <span class="status" id="status">Ready</span>
      <span class="divider"></span>
      <div class="doc-name">
        <input id="filename" placeholder="document" spellcheck="false" aria-label="Output file name" />
        <span class="ext">.pdf</span>
      </div>
      <button class="btn" id="download">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0L5 7.5M8 10l3-2.5M3 13h10"/></svg>
        Download
      </button>
    </div>
  </header>

  <div class="guide-overlay" id="guide">
    <div class="guide">
      <h2>Shortcuts</h2>
      <dl>
        <dt>⌘ S</dt><dd>Download PDF</dd>
        <dt>⌘ Z</dt><dd>Undo</dd>
        <dt>⇧ ⌘ Z</dt><dd>Redo</dd>
      </dl>
      <p style="margin:16px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5;">
        This app runs on a free server — Rendering may take a few extra seconds.
      </p>
      <div class="dismiss"><button id="guideDismiss">Got it</button></div>
    </div>
  </div>

  <main>
    <section class="pane source">
      <div class="pane-head"><span class="eyebrow">Source</span></div>
      <div class="editor" id="editorWrap">
        <pre id="highlight" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" placeholder="Start typing markdown…"></textarea>
        <div class="drop">Drop a .md file to open</div>
      </div>
    </section>

    <section class="pane preview">
      <div class="pane-head">
        <span class="eyebrow">Pages</span>
        <div class="spacer"></div>
        <div class="stepper" role="group" aria-label="PDF text size">
          <button id="sizeDown" aria-label="Decrease text size">&minus;</button>
          <span id="sizeVal" title="PDF text size">13</span>
          <button id="sizeUp" aria-label="Increase text size">+</button>
        </div>
      </div>
      <div class="proof" id="proof">
        <div class="empty" id="empty"></div>
      </div>
    </section>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
  const editor = document.getElementById('editor');
  const highlight = document.getElementById('highlight');
  const proof = document.getElementById('proof');
  const emptyMsg = document.getElementById('empty');
  const statusEl = document.getElementById('status');
  const downloadBtn = document.getElementById('download');
  const filename = document.getElementById('filename');
  const editorWrap = document.getElementById('editorWrap');
  const sizeVal = document.getElementById('sizeVal');
  const sizeUp = document.getElementById('sizeUp');
  const sizeDown = document.getElementById('sizeDown');

  const pdfjsLib = globalThis.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  const SIZE_MIN = 9, SIZE_MAX = 22;
  let fontSize = parseInt(localStorage.getItem('mdtopdf-size'), 10);
  if (!fontSize || fontSize < SIZE_MIN || fontSize > SIZE_MAX) fontSize = 13;
  function applySize() {
    sizeVal.textContent = fontSize;
    sizeDown.disabled = fontSize <= SIZE_MIN;
    sizeUp.disabled = fontSize >= SIZE_MAX;
    localStorage.setItem('mdtopdf-size', fontSize);
  }
  function changeSize(d) {
    const n = Math.min(SIZE_MAX, Math.max(SIZE_MIN, fontSize + d));
    if (n === fontSize) return;
    fontSize = n; applySize(); renderPdf();
  }
  sizeUp.addEventListener('click', () => changeSize(1));
  sizeDown.addEventListener('click', () => changeSize(-1));

  const sample = `# Markdown to PDF

Write markdown on the left — your PDF pages appear on the right. Use the **−** / **+** controls to adjust the output text size.

## Math

Inline equations like $E = mc^2$ and $e^{i\\pi} + 1 = 0$ sit naturally in text.

Display equations get their own line:

$$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$

$$\\int_0^\\infty e^{-x^2}\\,dx = \\frac{\\sqrt{\\pi}}{2}$$

Matrices and cases work too:

$$\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix} \\qquad f(x) = \\begin{cases} x^2 & x \\ge 0 \\\\ -x & x < 0 \\end{cases}$$

## Code

\`\`\`python
def quadratic(a, b, c):
    d = b**2 - 4*a*c
    return (-b + d**0.5) / (2*a)
\`\`\`

## Tables

| Symbol | Meaning |
| ------ | ------- |
| $\\nabla$ | Gradient |
| $\\partial$ | Partial derivative |
| $\\infty$ | Infinity |

> Dollar signs in prose like $5 or $10 stay literal — they're not mistaken for math.
`;
  editor.value = sample;

  let statusTimer = null;
  function setStatus(t, k) { clearTimeout(statusTimer); statusEl.textContent = t; statusEl.className = 'status' + (k ? ' ' + k : ''); }
  function flashStatus(t, k) { setStatus(t, k); statusTimer = setTimeout(() => setStatus('Ready'), 1800); }
  function showEmpty(msg) {
    if (msg) { emptyMsg.textContent = msg; emptyMsg.classList.add('show'); }
    else { emptyMsg.classList.remove('show'); }
  }

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inlineHi(s) {
    const codes = [];
    s = s.replace(/(`+)([^`]*?)\1/g, (m) => { codes.push(m); return '\u0000C' + (codes.length-1) + '\u0000'; });
    s = s.replace(/(\$\$[^$]+\$\$|\$[^$\n]+\$)/g, '<span class="tok-math">$1</span>');
    s = s.replace(/(\*\*|__)(.+?)\1/g, '<span class="tok-strong">$1$2$1</span>');
    s = s.replace(/(^|[^*_])([*_])([^*_\s][^*_]*?)\2/g, '$1<span class="tok-em">$2$3$2</span>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="tok-punct">[</span><span class="tok-link">$1</span><span class="tok-punct">](</span><span class="tok-url">$2</span><span class="tok-punct">)</span>');
    s = s.replace(/\u0000C(\d+)\u0000/g, (_, i) => '<span class="tok-code">' + codes[Number(i)] + '</span>');
    return s;
  }
  function highlightMd(src) {
    const lines = src.split('\n');
    let inFence = false;
    const out = lines.map((line) => {
      const raw = esc(line);
      if (/^\s*(```|~~~)/.test(line)) { inFence = !inFence; return '<span class="tok-fence">' + raw + '</span>'; }
      if (inFence) return '<span class="tok-code">' + raw + '</span>';
      if (/^\s*#{1,6}\s/.test(line)) return '<span class="tok-head">' + raw + '</span>';
      if (/^\s*>/.test(line)) return '<span class="tok-quote">' + inlineHi(raw) + '</span>';
      if (/^\s*([-*+]|\d+\.)\s/.test(line))
        return raw.replace(/^(\s*)([-*+]|\d+\.)(\s)/, '$1<span class="tok-list">$2</span>$3')
                  .replace(/(<\/span>\s)([\s\S]*)$/, (m, p1, rest) => p1 + inlineHi(rest));
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) return '<span class="tok-hr">' + raw + '</span>';
      return inlineHi(raw);
    });
    return out.join('\n') + '\n';
  }
  function renderHighlight() {
    highlight.innerHTML = highlightMd(editor.value);
    highlight.scrollTop = editor.scrollTop; highlight.scrollLeft = editor.scrollLeft;
  }
  editor.addEventListener('scroll', () => { highlight.scrollTop = editor.scrollTop; highlight.scrollLeft = editor.scrollLeft; });

  let lastBlob = null, pdfDirty = true;
  let busy = false, again = false, previewTimer = null;
  let renderedKey = null;
  const keyOf = () => fontSize + '\n' + editor.value;

  async function convert() {
    const res = await fetch('/api/convert', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ markdown: editor.value, fontSize }),
    });
    if (!res.ok) throw new Error(await res.text());
    return res.blob();
  }

  function clearPages() {
    proof.querySelectorAll('.page img').forEach((img) => {
      if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    });
    proof.querySelectorAll('.page').forEach((p) => p.remove());
  }

  async function displayPdf(blob) {
    const buf = await blob.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const scrollTop = proof.scrollTop;
    clearPages();

    const containerWidth = proof.clientWidth;
    const targetCssWidth = containerWidth * 0.72;
    const outputScale = window.devicePixelRatio || 1;

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const unscaledVp = page.getViewport({ scale: 1 });
      const baseScale = targetCssWidth / unscaledVp.width;
      const physW = Math.round(unscaledVp.width * baseScale * outputScale);
      const physH = Math.round(unscaledVp.height * baseScale * outputScale);
      const cssW = physW / outputScale;
      const cssH = physH / outputScale;

      const offscreen = document.createElement('canvas');
      offscreen.width = physW;
      offscreen.height = physH;

      const exactScale = physW / unscaledVp.width;
      const viewport = page.getViewport({ scale: exactScale });

      await page.render({
        canvasContext: offscreen.getContext('2d', { alpha: false }),
        viewport,
      }).promise;

      const img = document.createElement('img');
      img.style.width = cssW + 'px';
      img.style.height = cssH + 'px';
      img.style.display = 'block';

      const pageBlob = await new Promise((res) => offscreen.toBlob(res, 'image/png'));
      img.src = URL.createObjectURL(pageBlob);

      const wrapper = document.createElement('div');
      wrapper.className = 'page';
      wrapper.appendChild(img);
      proof.insertBefore(wrapper, emptyMsg);
    }
    proof.scrollTop = scrollTop;
  }

  let resizeTimer = null, lastWidth = 0, lastRenderDpr = 0;
  function onViewChange() {
    if (!lastBlob) return;
    const w = proof.clientWidth;
    const d = window.devicePixelRatio || 1;
    if (w === lastWidth && d === lastRenderDpr) return;
    lastWidth = w; lastRenderDpr = d;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => displayPdf(lastBlob), 250);
  }
  window.addEventListener('resize', onViewChange);
  (function watchDpr() {
    const mq = matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
    mq.addEventListener('change', function once() {
      mq.removeEventListener('change', once);
      onViewChange();
      watchDpr();
    });
  })();

  async function renderPdf() {
    if (!editor.value.trim()) {
      lastBlob = null; pdfDirty = false; renderedKey = null;
      clearPages();
      showEmpty('Empty document — start typing');
      setStatus('Ready');
      return;
    }
    if (keyOf() === renderedKey) { setStatus('Ready'); return; }
    if (busy) { again = true; return; }
    busy = true; setStatus('Rendering…', 'busy');
    try {
      const blob = await convert();
      lastBlob = blob; pdfDirty = false; renderedKey = keyOf();
      showEmpty(null);
      await displayPdf(blob);
      setStatus('Ready');
    } catch (err) {
      clearPages();
      lastBlob = null; pdfDirty = true; renderedKey = null;
      showEmpty('Preview unavailable — ' + (err.message || 'conversion failed'));
      setStatus('Conversion failed', 'error');
      console.error(err);
    } finally {
      busy = false;
      if (again) { again = false; renderPdf(); }
    }
  }
  function schedulePdf() { pdfDirty = true; clearTimeout(previewTimer); previewTimer = setTimeout(renderPdf, 300); }

  editor.addEventListener('input', () => { renderHighlight(); schedulePdf(); });

  function outName() {
    let n = (filename.value || 'document').trim().replace(/[\/\\:*?"<>|]+/g, '').replace(/\.pdf$/i, '');
    return (n || 'document') + '.pdf';
  }
  function save(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = outName();
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  async function download() {
    if (!editor.value.trim()) { flashStatus('Nothing to download'); return; }
    downloadBtn.disabled = true;
    try {
      let blob = lastBlob;
      if (pdfDirty || !blob) { setStatus('Preparing PDF…', 'busy'); blob = await convert(); lastBlob = blob; pdfDirty = false; }
      save(blob);
      flashStatus('Saved ' + outName());
    } catch (err) { setStatus('Conversion failed', 'error'); console.error(err); }
    finally { downloadBtn.disabled = false; }
  }
  downloadBtn.addEventListener('click', download);
  window.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); download(); }
  });

  let dragDepth = 0;
  editorWrap.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; editorWrap.classList.add('dragging'); });
  editorWrap.addEventListener('dragover', (e) => e.preventDefault());
  editorWrap.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; editorWrap.classList.remove('dragging'); } });
  editorWrap.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; editorWrap.classList.remove('dragging');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      editor.value = reader.result;
      const base = file.name.replace(/\.(md|markdown|txt)$/i, '');
      if (base) filename.value = base;
      renderHighlight(); renderPdf(); flashStatus('Opened ' + file.name);
    };
    reader.readAsText(file);
  });

  applySize();
  renderHighlight();
  renderPdf();

  (function () {
    if (localStorage.getItem('mdtopdf-guided')) return;
    const g = document.getElementById('guide');
    const btn = document.getElementById('guideDismiss');
    g.classList.add('show');
    function close() {
      g.classList.add('fade');
      localStorage.setItem('mdtopdf-guided', '1');
      setTimeout(() => g.classList.remove('show', 'fade'), 250);
    }
    btn.addEventListener('click', close);
    g.addEventListener('mousedown', (e) => { if (e.target === g) close(); });
    window.addEventListener('keydown', function onKey(e) {
      if (e.key === 'Escape') { close(); window.removeEventListener('keydown', onKey); }
    });
  })();
</script>
</body>
</html>
